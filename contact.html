<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                My Website
            </a>

            <nav>
                <ul class="nav-links">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="services.html">
                            Services
                        </a>
                    </li>

                    <li>
                        <a href="projects.html">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="contact.html" class="active">
                            Contact
                        </a>
                    </li>

                </ul>
            </nav>

        </div>

    </header>


    <main>

        <section class="page-header">

            <h1>
                Contact Us
            </h1>

            <p>
                We'd love to hear from you
            </p>

        </section>


        <section class="section">

            <div class="container">

                <div class="contact-grid">

                    <!-- Contact Information -->
                    <div class="contact-info">

                        <h2>
                            Get In Touch
                        </h2>

                        <div class="contact-item">

                            <strong>
                                📧 Email
                            </strong>

                            <span>
                                9801yumna@gmail.com
                            </span>

                        </div>


                        <div class="contact-item">

                            <strong>
                                📞 Phone
                            </strong>

                            <span>
                                +91 9801753009
                            </span>

                        </div>


                        <div class="contact-item">

                            <strong>
                                📍 Address
                            </strong>

                            <span>
                                Lucknow, Uttar Pradesh, India
                            </span>

                        </div>

                    </div>


                    <!-- Contact Form -->
                    <div class="contact-form">

                        <h2>
                            Send a Message
                        </h2>

                        <form action="#" method="post">

                            <div class="form-group">

                                <label for="name">
                                    Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your name"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="email">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="message">
                                    Message
                                </label>

                                <textarea
                                    id="message"
                                    name="message"
                                    placeholder="Write your message..."
                                    required
                                ></textarea>

                            </div>


                            <button
                                type="submit"
                                class="submit-btn"
                            >
                                Send Message
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 <strong>My Website</strong> |
            All Rights Reserved
        </p>

    </footer>

</body>
</html>
